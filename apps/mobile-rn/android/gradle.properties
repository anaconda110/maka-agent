# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon. Tune -Xmx according to available memory.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure (React Native 0.71+ requires AndroidX).
android.useAndroidX=true
android.enableJetifier=false

# Automatically convert third-party libraries to use AndroidX.
android.enableJetifier=false

# Use Gradle daemon and parallel builds.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# React Native new architecture flags (Fabric + TurboModules).
# Toggle to enable the New Architecture; keep disabled by default to ensure compatibility.
newArchEnabled=false

# Use Hermes JS engine (default for RN 0.74+).
hermesEnabled=true

# Disable Gradle build cache to keep CI/local behavior consistent (optional).
# org.gradle.caching=true