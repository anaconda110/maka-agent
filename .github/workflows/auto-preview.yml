name: Auto rust preview
on:
  schedule:
    # UTC 01:00 = 北京时间 09:00,每天自动同步上游并重建
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Merge upstream rust-preview into automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "maka-fork-automation"
          git config user.email "anaconda110@users.noreply.github.com"
          git remote add upstream https://github.com/apache/maka.git
          git fetch --no-tags upstream rust-preview
          git merge --no-edit upstream/rust-preview
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:automation
  trigger:
    needs: [sync]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch fork build on automation ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-rust-preview.yml -R ${{ github.repository }} -r automation -f publish=false
