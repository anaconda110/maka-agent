name: Auto rust preview
on:
  schedule:
    # UTC 01:00 = 北京时间 09:00,每天自动同步上游并重建
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  workflows: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rebuild rust-preview as upstream + fork patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init work
          cd work
          git config user.name "maka-fork-automation"
          git config user.email "anaconda110@users.noreply.github.com"
          git remote add upstream https://github.com/apache/maka.git
          git fetch --no-tags upstream rust-preview
          git checkout -B work FETCH_HEAD
          ls ../fork-patches/*.patch
          git apply --whitespace=nowarn ../fork-patches/*.patch
          git add -A
          git commit -m "fork build patches: release classifier (.m/README whitelist + audit fixtures)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" work:rust-preview
  trigger:
    needs: [sync]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch npm-publication on patched rust-preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run npm-publication.yml -R ${{ github.repository }} -r rust-preview -f publish=false
